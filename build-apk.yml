name: Build MIJA APP APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Create www directory
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MIJA APP</title></head><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icon
        run: |
          pip install Pillow --break-system-packages -q
          python3 - << 'EOF'
          from PIL import Image
          import os
          img = Image.open("icon-512.png").convert("RGBA")
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              r = img.resize((size, size), Image.LANCZOS)
              r.save(f"{path}/ic_launcher.png")
              r.save(f"{path}/ic_launcher_round.png")
          EOF
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIJA-APP-v1.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
